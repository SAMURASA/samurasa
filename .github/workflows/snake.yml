name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Generate monochrome contribution snake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          python3 - <<'PY'
          from datetime import date, timedelta
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from pathlib import Path
          import re
          import html

          USER = "samurasa"
          URL = f"https://github.com/users/{USER}/contributions"
          request = Request(URL, headers={"User-Agent": "XTRAS-profile-snake/1.0"})
          with urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8", errors="replace")

          class ContributionParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.days = {}
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  day = attrs.get("data-date")
                  level = attrs.get("data-level")
                  classes = attrs.get("class", "")
                  if day and level is not None and re.fullmatch(r"\d{4}-\d{2}-\d{2}", day):
                      try:
                          self.days[date.fromisoformat(day)] = max(0, min(4, int(level)))
                      except ValueError:
                          pass

          parser = ContributionParser()
          parser.feed(page)
          days = parser.days
          if not days:
              raise SystemExit("Could not parse contribution cells from GitHub. The profile HTML format may have changed.")

          first = min(days)
          last = max(days)
          start = first - timedelta(days=(first.weekday() + 1) % 7)
          weeks = ((last - start).days // 7) + 1
          weeks = max(1, weeks)

          cell, gap, left, top = 10, 3, 36, 43
          step = cell + gap
          width = left + weeks * step + 12
          height = top + 7 * step + 12
          colors = {0: "#161B22", 1: "#404040", 2: "#707070", 3: "#B0B0B0", 4: "#FFFFFF"}
          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 {width} {height}" role="img" aria-labelledby="title desc">',
              '<title id="title">XTRAS monochrome contribution snake</title>',
              '<desc id="desc">A grayscale GitHub contribution calendar with an animated white snake.</desc>',
              '<rect width="100%" height="100%" rx="8" fill="#0D1117"/>',
              '<text x="8" y="17" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="600">CONTRIBUTION MATRIX / XTRAS</text>',
          ]

          for month_day in sorted(days):
              if month_day.day == 1:
                  col = (month_day - start).days // 7
                  if 0 <= col < weeks:
                      label = month_day.strftime("%b")
                      svg.append(f'<text x="{left + col * step}" y="33" fill="#B8B8B8" font-family="sans-serif" font-size="9">{html.escape(label)}</text>')

          for row, label in [(1, "Mon"), (3, "Wed"), (5, "Fri")]:
              svg.append(f'<text x="2" y="{top + row * step + 8}" fill="#A0A0A0" font-family="sans-serif" font-size="8">{label}</text>')

          for day, level in sorted(days.items()):
              offset = (day - start).days
              col, row = offset // 7, offset % 7
              if 0 <= col < weeks:
                  x, y = left + col * step, top + row * step
                  tooltip = f"{level} contribution level on {day.isoformat()}"
                  svg.append(
                      f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" '
                      f'fill="{colors[level]}" data-date="{day.isoformat()}" data-level="{level}">'
                      f'<title>{html.escape(tooltip)}</title></rect>'
                  )

          # Route the animated snake across the grid in a continuous, alternating path.
          points = []
          for row in range(7):
              columns = range(weeks) if row % 2 == 0 else range(weeks - 1, -1, -1)
              for col in columns:
                  points.append((left + col * step + cell / 2, top + row * step + cell / 2))
          path = "M " + " L ".join(f"{x:.1f},{y:.1f}" for x, y in points)
          svg.append(f'<path id="snake-route" d="{path}" fill="none" stroke="none"/>')
          for i in range(11):
              opacity = max(0.18, 0.95 - i * 0.075)
              delay = -i * 0.22
              radius = 3.1 if i == 0 else 2.7
              svg.append(
                  f'<circle r="{radius}" fill="#FFFFFF" opacity="{opacity:.2f}">'
                  f'<animateMotion dur="42s" begin="{delay:.2f}s" repeatCount="indefinite" path="{path}"/>'
                  '</circle>'
              )

          svg.append('</svg>')
          Path("dist/github-contribution-grid-snake.svg").write_text("\n".join(svg), encoding="utf-8")
          print(f"Generated monochrome snake for {len(days)} contribution days ({weeks} weeks).")
          PY

          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          git commit -m "Update monochrome contribution snake"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/SAMURASA/samurasa.git"
          git push --force origin output
